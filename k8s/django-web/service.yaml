apiVersion: v1
kind: Service
metadata:
  name: django-web
  namespace: customer-portal
  labels:
    app: django-web
spec:
  type: NodePort
  selector:
    app: django-web
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30001
---
# Expose Postgres via NodePort for external access (use only for debugging; consider port-forward or secured ingress for production)
apiVersion: v1
kind: Service
metadata:
  name: django-postgres
  namespace: customer-portal
  labels:
    app: django-postgres
spec:
  type: NodePort
  selector:
    app: django-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30006
