apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-web
  namespace: customer-portal
  labels:
    app: django-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django-web
  template:
    metadata:
      labels:
        app: django-web
    spec:
      containers:
        - name: django-web
          image: ghcr.io/example/django:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: django-config
            - secretRef:
                name: django-secret
          volumeMounts:
            - name: app-source
              mountPath: /app
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: app-source
          emptyDir: {}
