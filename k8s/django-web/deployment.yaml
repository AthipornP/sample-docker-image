apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-web
  namespace: customer-portal
  labels:
    app: django-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: django-web
  template:
    metadata:
      labels:
        app: django-web
    spec:
      containers:
        - name: django-web
          image: docker.io/beamblackdragon/django:f9c653c
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: django-config
            - secretRef:
                name: django-secret
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
      # NOTE: removed an emptyDir mount that previously masked the application files
      # If you need to provide runtime writable storage for /app, use a PVC that
      # contains the application content or change the image to copy runtime
      # writable files to a different path. Mounting an emptyDir over /app
      # removes files that are baked into the image (like manage.py).
