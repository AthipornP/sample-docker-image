apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: customer-portal

commonLabels:
  app.kubernetes.io/part-of: customer-portal

resources:
  - namespace.yaml
  - svelte-portal
  - django-web
  - php-web
  - django-api
  - php-api
  - dotnet8-api
  - postgres-operator  # CloudNativePG operator and PostgreSQL HA cluster
