apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: customer-portal

commonLabels:
  app.kubernetes.io/part-of: customer-portal

resources:
  - namespace.yaml
  - svelte-portal
  - django-web
  - php-web
  - django-api
  - php-api
  - dotnet8-api
  # postgres-operator is managed as a separate ArgoCD Application to avoid
  # namespace/ID conflicts with this customer-portal kustomize build.
