# CloudNativePG Operator v1.20.x installation
# This operator provides PostgreSQL High Availability with automatic failover, 
# streaming replication, backup/restore, and monitoring

apiVersion: v1
kind: Namespace
metadata:
  name: cloudnativepg-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudnativepg-controller-manager
  namespace: cloudnativepg-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudnativepg-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - events
  - persistentvolumeclaims
  - pods
  - secrets
  - services
  - namespaces
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods/exec
  verbs:
  - create
- apiGroups:
  - ""
  resources:
  - pods/status
  verbs:
  - get
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - backups
  - clusters
  - poolers
  - scheduledbackups
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - backups/status
  - clusters/status
  - poolers/status
  - scheduledbackups/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# grant operator access to manage webhook configurations
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - mutatingwebhookconfigurations
  - validatingwebhookconfigurations
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudnativepg-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudnativepg-manager-role
subjects:
- kind: ServiceAccount
  name: cloudnativepg-controller-manager
  namespace: cloudnativepg-system
---
# Webhook Service - นี่คือสิ่งที่ขาดหายไป!
apiVersion: v1
kind: Service
metadata:
  name: cloudnativepg-webhook-server
  namespace: cloudnativepg-system
  labels:
    app.kubernetes.io/name: cloudnative-pg
spec:
  ports:
  - name: webhook-server
    port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    app.kubernetes.io/name: cloudnative-pg
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudnativepg-controller-manager
  namespace: cloudnativepg-system
  labels:
    app.kubernetes.io/name: cloudnative-pg
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudnative-pg
    spec:
      serviceAccountName: cloudnativepg-controller-manager
      initContainers:
      - name: cert-setup
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          # Copy and rename cert files to expected names
          cp /tmp/certs/tls.crt /tmp/k8s-webhook-server/serving-certs/apiserver.crt
          cp /tmp/certs/tls.key /tmp/k8s-webhook-server/serving-certs/apiserver.key
          chmod 644 /tmp/k8s-webhook-server/serving-certs/apiserver.crt
          chmod 600 /tmp/k8s-webhook-server/serving-certs/apiserver.key
          ls -la /tmp/k8s-webhook-server/serving-certs/
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: webhook-cert-dir
        - mountPath: /tmp/certs
          name: webhook-cert
          readOnly: true
      containers:
      - name: manager
        image: ghcr.io/cloudnative-pg/cloudnative-pg:1.27.0
        imagePullPolicy: IfNotPresent
        args:
        - controller
        - --leader-elect
        - --config-map-name=cloudnativepg-config
        - --webhook-port=9443
        env:
        - name: OPERATOR_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: MONITORING_ENABLED
          value: "false"
        - name: WEBHOOK_CERT_DIR
          value: "/tmp/k8s-webhook-server/serving-certs"
        resources:
          limits:
            cpu: 500m
            memory: 200Mi
          requests:
            cpu: 100m
            memory: 100Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 10001
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: webhook-cert-dir
        - mountPath: /tmp/certs
          name: webhook-cert
          readOnly: true
        - mountPath: /run/secrets
          name: run-secrets
      volumes:
      - name: webhook-cert
        secret:
          secretName: cloudnativepg-webhook-server-cert
      - name: webhook-cert-dir
        emptyDir: {}
      - name: run-secrets
        emptyDir: {}
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudnativepg-config
  namespace: cloudnativepg-system
data:
  # Default configuration for CloudNativePG
  config: |
    {}