# CloudNativePG Operator v1.20.x installation
# This operator provides PostgreSQL High Availability with automatic failover, 
# streaming replication, backup/restore, and monitoring

apiVersion: v1
kind: Namespace
metadata:
  name: cloudnativepg-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudnativepg-controller-manager
  namespace: cloudnativepg-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudnativepg-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - events
  - persistentvolumeclaims
  - pods
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods/exec
  verbs:
  - create
- apiGroups:
  - ""
  resources:
  - pods/status
  verbs:
  - get
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - backups
  - clusters
  - poolers
  - scheduledbackups
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - backups/status
  - clusters/status
  - poolers/status
  - scheduledbackups/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudnativepg-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudnativepg-manager-role
subjects:
- kind: ServiceAccount
  name: cloudnativepg-controller-manager
  namespace: cloudnativepg-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudnativepg-controller-manager
  namespace: cloudnativepg-system
  labels:
    app.kubernetes.io/name: cloudnativepg
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudnativepg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudnativepg
    spec:
      serviceAccountName: cloudnativepg-controller-manager
      containers:
      - name: manager
        image: ghcr.io/cloudnative-pg/cloudnative-pg:1.20.4
        imagePullPolicy: IfNotPresent
        command:
        - /manager
        - controller
        args:
        - --leader-elect
        - --config-map-name=cloudnativepg-config
        env:
        - name: OPERATOR_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: MONITORING_ENABLED
          value: "false"
        resources:
          limits:
            cpu: 500m
            memory: 200Mi
          requests:
            cpu: 100m
            memory: 100Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: cloudnativepg-webhook-server-cert
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudnativepg-config
  namespace: cloudnativepg-system
data:
  # Default configuration for CloudNativePG