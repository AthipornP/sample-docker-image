# External Access Services for PostgreSQL Cluster
# These services provide different ways to access PostgreSQL from outside the cluster

---
# NodePort Service - Direct access via Node IP:Port
apiVersion: v1
kind: Service
metadata:
  name: postgres-nodeport
  namespace: customer-portal
  labels:
    app: django-postgres-cluster
    service-type: external-access
spec:
  type: NodePort
  selector:
    cnpg.io/cluster: django-postgres-cluster
    cnpg.io/instanceRole: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30006  # Access via <node-ip>:30006

---
# LoadBalancer Service (if supported by your cluster)
