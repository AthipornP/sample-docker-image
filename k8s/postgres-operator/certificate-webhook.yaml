apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cloudnativepg-webhook-server-cert
  namespace: cloudnativepg-system
spec:
  dnsNames:
    - cloudnativepg-webhook-server.cloudnativepg-system.svc
  secretName: cloudnativepg-webhook-server-cert
  issuerRef:
    name: letsencrypt-selfsigned
    kind: ClusterIssuer
  commonName: cloudnativepg-webhook-server.cloudnativepg-system.svc
  duration: 2160h # 90d
  renewBefore: 360h # 15d
