apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-api
  namespace: customer-portal
  labels:
    app: django-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django-api
  template:
    metadata:
      labels:
        app: django-api
    spec:
      containers:
        - name: django-api
          image: docker.io/beamblackdragon/django-api:f9c653c
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: django-api-config
          resources:
            limits:
              cpu: "300m"
              memory: "256Mi"
