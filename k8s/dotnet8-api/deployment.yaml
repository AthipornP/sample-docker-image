apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet8-api
  namespace: customer-portal
  labels:
    app: dotnet8-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dotnet8-api
  template:
    metadata:
      labels:
        app: dotnet8-api
    spec:
      containers:
        - name: dotnet8-api
          image: docker.io/beamblackdragon/dotnet8-api:f9c653c
          ports:
            - containerPort: 5100
          envFrom:
            - configMapRef:
                name: dotnet8-api-config
            - secretRef:
                name: dotnet8-api-secret
          resources:
            limits:
              cpu: "300m"
              memory: "256Mi"
