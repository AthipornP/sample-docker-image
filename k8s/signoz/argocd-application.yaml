apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signoz
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.signoz.io
    chart: signoz
    targetRevision: 0.99.0  # ใช้ version ล่าสุด
    helm:
      values: |
        # SigNoz Helm Chart Values
        
        # Global Configuration
        global:
          storageClass: "rook-ceph-block"
        
        # SigNoz Query Service UI
        signoz:
          service:
            type: NodePort
            nodePort: 30301
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
        clickhouse:
          enabled: true
          persistence:
            enabled: true
            size: 20Gi
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
        
        # OTEL Collector Configuration
        otelCollector:
          service:
            type: NodePort
          ports:
            otlp:
              nodePort: 30317
            otlp-http:
              nodePort: 30318
          config:
            receivers:
              otlp:
                protocols:
                  http:
                    endpoint: 0.0.0.0:4318
                    cors:
                      allowed_origins:
                        - "http://localhost:*"
                        - "http://10.191.10.50:*"
                        - "http://10.191.10.51:*"
                        - "http://10.191.10.60:*"
                        - "http://10.191.10.61:*"
                        - "http://10.191.10.161:*"
                        - "https://localhost:*"
                        - "https://10.191.10.50:*"
                        - "https://10.191.10.51:*"
                        - "https://10.191.10.60:*"
                        - "https://10.191.10.61:*"
                        - "https://10.191.10.161:*"
                        - "http://10.159.0.18"
                        - "https://*.trycloudflare.com"
                      allowed_headers:
                        - "*"
                      max_age: 7200
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
        
        # OTEL Collector Metrics
        otelCollectorMetrics:
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
  
  destination:
    server: https://kubernetes.default.svc
    namespace: signoz
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
