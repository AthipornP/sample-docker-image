apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: signoz
  labels:
    app: signoz
    component: clickhouse
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: signoz
      component: clickhouse
  template:
    metadata:
      labels:
        app: signoz
        component: clickhouse
    spec:
      containers:
      - name: clickhouse
        image: clickhouse/clickhouse-server:23.7-alpine
        ports:
        - containerPort: 9000
          name: tcp
        - containerPort: 8123
          name: http
        env:
        - name: CLICKHOUSE_DB
          value: "signoz"
        volumeMounts:
        - name: clickhouse-data
          mountPath: /var/lib/clickhouse
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
  volumeClaimTemplates:
  - metadata:
      name: clickhouse-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: rook-ceph-block
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: signoz
  labels:
    app: signoz
    component: clickhouse
spec:
  type: ClusterIP
  ports:
  - port: 9000
    targetPort: 9000
    protocol: TCP
    name: tcp
  - port: 8123
    targetPort: 8123
    protocol: TCP
    name: http
  selector:
    app: signoz
    component: clickhouse
