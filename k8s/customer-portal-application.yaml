apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: customer-portal
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://10.191.10.60/athiporn_p/sample-docker-image.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: customer-portal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
