apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
      # nodePort intentionally omitted to avoid conflicts; cluster will assign one
  selector:
    app: grafana
