apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-recording-rules
  namespace: grafana
data:
  recording-rules.yml: |
    groups:
    - name: kubernetes.rules
      interval: 30s
      rules:
      # CPU Usage Recording Rules
      - record: node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate
        expr: |
          sum(irate(container_cpu_usage_seconds_total{pod!="",container!=""}[5m])) by (node, namespace, pod, container)

      # Memory Usage Recording Rules
      - record: node_namespace_pod_container:container_memory_usage_bytes
        expr: |
          sum(container_memory_usage_bytes{pod!="",container!=""}) by (node, namespace, pod, container)

      # Pod CPU Request Recording Rules
      - record: kube_pod_container_resource_requests:cpu_cores
        expr: |
          sum(kube_pod_container_resource_requests{resource="cpu"}) by (namespace, pod, container)

      # Pod Memory Request Recording Rules
      - record: kube_pod_container_resource_requests:memory_bytes
        expr: |
          sum(kube_pod_container_resource_requests{resource="memory"}) by (namespace, pod, container)

      # Container CPU Usage (alternative recording)
      - record: container_cpu_usage:rate5m
        expr: |
          rate(container_cpu_usage_seconds_total{pod!="",container!=""}[5m])

      # Node CPU Usage
      - record: node:node_cpu_utilisation:rate5m
        expr: |
          (1 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])))) * 100

      # Node Memory Usage
      - record: node:node_memory_utilisation:ratio
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
