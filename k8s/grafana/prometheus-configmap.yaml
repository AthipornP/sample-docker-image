apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: grafana
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    rule_files:
      - "/etc/prometheus/rules/*.yml"
    
    scrape_configs:
      # CloudNativePG monitoring - Direct pod discovery with metrics endpoint
      - job_name: 'cloudnativepg'
        honor_labels: true
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - customer-portal
        relabel_configs:
          # Keep only CloudNativePG instance pods with podRole=instance
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_podRole]
            action: keep
            regex: instance
          # Only scrape pods with metrics port (port 9187)
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "9187"
          # Set the metrics path
          - target_label: __metrics_path__
            replacement: /metrics
          # Extract pod and cluster labels
          - action: labelmap
            regex: __meta_kubernetes_pod_label_cnpg_io_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
            action: replace
            target_label: cluster
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_instanceRole]
            action: replace
            target_label: instance_role
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_instanceName]
            action: replace
            target_label: instance
        # Rename kubernetes labels to match dashboard expectations
        metric_relabel_configs:
          - source_labels: [kubernetes_namespace]
            target_label: namespace
          - source_labels: [kubernetes_pod_name]
            target_label: pod
      
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
