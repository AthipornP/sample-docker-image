apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: grafana
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    rule_files:
      - "/etc/prometheus/rules/*.yml"
    
    scrape_configs:
      # CloudNativePG monitoring via direct pod discovery
      - job_name: 'cloudnativepg-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Keep only CloudNativePG cluster pods with metrics port
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
            action: keep
            regex: .+
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metrics
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
            action: replace
            target_label: cnpg_cluster
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_instanceRole]
            action: replace
            target_label: cnpg_role
      
      # Kubernetes system monitoring  
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: grafana|postgres-operator|kube-system
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
      
      # Legacy postgres-exporter (fallback)
      - job_name: 'postgres-exporter'
        static_configs:
          - targets: ['postgres-exporter.grafana.svc.cluster.local:9187']
