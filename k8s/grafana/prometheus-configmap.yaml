apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: grafana
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    rule_files:
      - "/etc/prometheus/rules/*.yml"
    
    scrape_configs:
      # CloudNativePG monitoring - Direct pod discovery with metrics endpoint
      - job_name: 'cloudnativepg'
        honor_labels: true
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - customer-portal
                - postgres-operator
        relabel_configs:
          # Keep only CloudNativePG instance pods
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
            action: keep
            regex: .+
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_podRole]
            action: keep
            regex: instance
          # Only scrape pods with metrics port
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metrics
          # Set metrics path
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # Default metrics path if not specified
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: replace
            target_label: __metrics_path__
            regex: metrics
            replacement: /metrics
          # Extract labels
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
            action: replace
            target_label: cluster
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_instanceRole]
            action: replace
            target_label: instance_role
      
      # PostgreSQL Exporter - Direct scrape
      - job_name: 'postgres-exporter'
        honor_labels: true
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - grafana
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: postgres-exporter
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
      
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
