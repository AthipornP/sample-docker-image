apiVersion: batch/v1
kind: Job
metadata:
  name: install-prometheus-crds
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-1"  # ทำงานก่อน resources อื่นๆ
    argocd.argoproj.io/hook: PreSync    # Hook ก่อน sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: prometheus-crd-installer
      restartPolicy: OnFailure
      containers:
      - name: install-crds
        image: bitnami/kubectl:latest
        command:
        - /bin/bash
        - -c
        - |
          echo "🔧 Installing Prometheus Operator CRDs..."
          
          PROMETHEUS_OPERATOR_VERSION="v0.68.0"
          BASE_URL="https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/${PROMETHEUS_OPERATOR_VERSION}/example/prometheus-operator-crd"
          
          CRD_FILES=(
            "monitoring.coreos.com_alertmanagerconfigs.yaml"
            "monitoring.coreos.com_alertmanagers.yaml" 
            "monitoring.coreos.com_podmonitors.yaml"
            "monitoring.coreos.com_probes.yaml"
            "monitoring.coreos.com_prometheuses.yaml"
            "monitoring.coreos.com_prometheusrules.yaml"
            "monitoring.coreos.com_servicemonitors.yaml"
            "monitoring.coreos.com_thanosrulers.yaml"
          )
          
          for crd in "${CRD_FILES[@]}"; do
            echo "⏳ Installing $crd..."
            if kubectl apply --server-side -f "${BASE_URL}/${crd}"; then
              echo "✅ Installed $crd successfully"
            else
              echo "❌ Failed to install $crd"
              exit 1
            fi
          done
          
          echo "🔍 Checking installed CRDs:"
          kubectl get crd | grep monitoring.coreos.com
          echo "✅ Prometheus Operator CRDs installation completed!"
---
# ServiceAccount และ RBAC สำหรับ CRD installation Job
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-crd-installer
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-2"  # ทำงานก่อน Job
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-crd-installer
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-crd-installer
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-crd-installer
subjects:
- kind: ServiceAccount
  name: prometheus-crd-installer
  namespace: grafana