apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: grafana
  labels:
    grafana_dashboard: "1"
data:
  cloudn-dashboard.json: |
    {
      "dashboard": {
        "title": "CloudNativePG Cluster",
        "description": "Monitor CloudNativePG PostgreSQL cluster",
        "tags": ["cloudnativepg", "postgres"],
        "timezone": "browser",
        "panels": [],
        "refresh": "30s",
        "version": 1
      }
    }
