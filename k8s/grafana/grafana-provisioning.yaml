apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.grafana.svc.cluster.local:9090
        isDefault: true
        editable: true
  
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'cloudnativepg'
        orgId: 1
        folder: 'Databases'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 60
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
